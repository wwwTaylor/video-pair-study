<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>视频对比问卷</title>
  <link rel="stylesheet" href="style.css?v=3a7da672">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" id="brand">视频对比问卷</div>
      <div class="progress-wrap" id="progressWrap" hidden>
        <span class="progress-text" id="progressText"></span>
        <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </div>
  </header>

  <div class="banner-wrap">
    <div class="banner" id="pilotBanner" hidden>试运行版本</div>
    <div class="banner warn" id="syncBanner" hidden>
      <span id="syncText"></span>
      <button class="btn secondary" id="syncRetry" type="button">重试</button>
    </div>
  </div>

  <main>
    <section id="view-welcome" class="view narrow">
      <div class="card">
        <h1 id="welcomeTitle"></h1>
        <p class="lead" id="welcomeIntro"></p>
        <div class="field">
          <label for="annotatorId">ID</label>
          <input id="annotatorId" type="text" maxlength="64" autocomplete="off" spellcheck="false" placeholder="随便填">
        </div>
        <p class="help" id="consentText"></p>
        <div class="actions">
          <button class="btn primary" id="startBtn" type="button">开始</button>
        </div>
      </div>
    </section>

    <section id="view-trial" class="view" hidden>
      <div class="story-line">
        <h2 class="story-title" id="storyTitle"></h2>
        <p class="story-text" id="storyText"></p>
      </div>

      <div class="videos">
        <figure class="video-card">
          <figcaption><span class="tag">A</span></figcaption>
          <div class="video-slot" id="slotL"></div>
        </figure>
        <figure class="video-card">
          <figcaption><span class="tag">B</span></figcaption>
          <div class="video-slot" id="slotR"></div>
        </figure>
      </div>

      <div class="toolbar">
        <button class="btn secondary" id="playBoth" type="button">▶ 重播</button>
      </div>

      <form class="questions compact" id="questions" onsubmit="return false"></form>

      <div class="submit-row">
        <button class="btn primary" id="submitBtn" type="button" disabled>下一题</button>
      </div>
    </section>

    <section id="view-done" class="view narrow" hidden>
      <div class="card center">
        <div class="big-check" aria-hidden="true">✓</div>
        <h1>完成，谢谢！</h1>
        <p class="lead" id="doneText"></p>
        <p class="error" id="doneWarn" hidden></p>
        <div class="actions center">
          <button class="btn primary" id="continueBtn" type="button">再来一组</button>
          <button class="btn secondary" id="finishBtn" type="button">结束</button>
        </div>
      </div>
    </section>

    <section id="view-message" class="view narrow" hidden>
      <div class="card center">
        <h1 id="messageTitle"></h1>
        <p class="lead" id="messageText"></p>
      </div>
    </section>
  </main>

  <script src="app.js?v=3a7da672"></script>
</body>
</html>
